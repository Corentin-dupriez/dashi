[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashiyaml"
version = "0.0.1"
description = "Dashboard as code tool - turn YAML configs into standalone HTML dashboards"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Corentin Dupriez" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Utilities",
]
dependencies = ["polars", "plotly", "pyyaml", "jinja2", "typer", "duckdb"]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]

[project.urls]
Homepage = "https://github.com/Corentin-dupriez/dashi"
"Bug Tracker" = "https://github.com/Corentin-dupriez/dashi/issues"

[project.scripts]
dashi = "dashi.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dashi*"]
exclude = ["tests*"]
